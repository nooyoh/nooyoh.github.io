<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이호윤의 포트폴리오</title>
<meta name="description" content="이호윤이 진행한 임베디드 프로젝트 포트폴리오">
<meta property="og:title" content="이호윤의 포트폴리오">
<meta property="og:description" content="제가 진행한 프로젝트입니다. 카드를 누르면 프로젝트 상세 내용이 열립니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --line:#E4E7EB; --line-2:#D3D8DE;
  --ink:#141A22; --ink-2:#4B5563; --ink-3:#8B95A1;
  --accent:#2563EB; --accent-soft:#EAF1FE;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body.locked{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

/* header */
header{padding:64px 0 0;margin-bottom:36px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:5px 12px 5px 10px;border-radius:999px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
h1{margin-top:18px;font-size:clamp(32px,4.8vw,50px);font-weight:800;letter-spacing:-.04em;line-height:1.15}
h1 .name{color:var(--accent);white-space:nowrap}
h1 span.rest{color:var(--ink)}
.sub{margin-top:14px;color:var(--ink-2);font-size:16.5px;max-width:620px}
.hline{margin-top:40px;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.hline::after{content:"";flex:1;height:1px;background:var(--line-2)}
.hline b{color:var(--ink);font-weight:700}
.contact{position:relative;flex-shrink:0;margin-top:6px}
.cbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--card);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s}
.cbtn:hover,.cbtn[aria-expanded="true"]{border-color:var(--ink);}
.cbtn svg{width:16px;height:16px}
.pop{position:absolute;right:0;top:calc(100% + 10px);width:310px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(20,26,34,.12);padding:8px;z-index:30;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.row{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:10px}
.row:hover{background:var(--bg)}
.row .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.row .ic svg{width:17px;height:17px}
.row .tx{flex:1;min-width:0}
.row small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.row a{font-size:14.5px;font-weight:600;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row a:hover{color:var(--accent)}
.copy{border:none;background:none;cursor:pointer;color:var(--ink-3);font-size:12px;padding:4px 6px;border-radius:6px}
.copy:hover{color:var(--ink);background:var(--line)}

/* cards */
main{padding-bottom:96px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .22s ease,box-shadow .22s ease,border-color .22s}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,26,34,.10);border-color:var(--line-2);outline:none}
.cover{aspect-ratio:16/10;border-bottom:1px solid var(--line)}
.cover svg{width:100%;height:100%;display:block}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--ink-3)}
.meta .no{font-family:var(--mono);font-weight:700;color:var(--accent)}
.meta i{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.card h3{font-size:18.5px;font-weight:750;letter-spacing:-.02em;line-height:1.42;margin:9px 0 8px}
.card .sum{font-size:14.5px;color:var(--ink-2);line-height:1.65}
.skills{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:18px}
.skills li{font-size:12px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:999px}

footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:13px;color:var(--ink-3)}

/* detail */
.scrim{position:fixed;inset:0;background:rgba(20,26,34,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--card);z-index:50;transform:translateX(102%);transition:transform .36s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none;box-shadow:-20px 0 50px rgba(20,26,34,.12)}
.sbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px 0 28px;border-bottom:1px solid var(--line)}
.sbar .path{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .path b{color:var(--accent);font-family:var(--mono)}
.ctrl{display:flex;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--card);padding:7px 13px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn svg{width:15px;height:15px;fill:currentColor}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain}
.dhead{padding:40px 44px 30px}
.dhead h2{font-size:clamp(24px,3.2vw,31px);font-weight:800;letter-spacing:-.03em;line-height:1.3;margin-top:10px}
.role{margin-top:22px;background:var(--bg);border-radius:12px;padding:16px 20px}
.role .lab{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.role ul{list-style:none}
.role li{position:relative;padding-left:14px;font-size:15px;margin:3px 0}
.role li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dhead .actions{margin-top:18px}
.tabs{position:sticky;top:0;z-index:5;display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 30px;overflow-x:auto}
.tabs a{font-size:14px;font-weight:600;color:var(--ink-3);text-decoration:none;padding:14px 14px 12px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a b{font-family:var(--mono);font-weight:700;margin-right:6px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a.on b{color:var(--accent)}
.dsec{padding:40px 44px 8px}
.dsec:last-of-type{padding-bottom:40px}
.dsec>h3{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:16px}
.dsec>h3 .n{font-family:var(--mono);font-size:13px;color:var(--accent)}
.dsec h4{font-size:16px;font-weight:700;margin:26px 0 8px}
.dsec h4:first-of-type{margin-top:4px}
.dsec h4 .m{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-right:8px;font-weight:600}
ul.pts{list-style:none}
ul.pts li{position:relative;padding-left:16px;margin:6px 0;color:var(--ink-2);font-size:15px}
ul.pts li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1.5px;background:var(--ink-3)}
ul.pts li strong{color:var(--ink);font-weight:650}
code{font-family:var(--mono);font-size:.86em;background:var(--bg);border:1px solid var(--line);padding:0 5px;border-radius:4px;color:var(--ink)}
.kv{display:grid;grid-template-columns:110px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:20px}
.kv div{padding:10px 16px;border-top:1px solid var(--line);font-size:14.5px}
.kv div:nth-child(-n+2){border-top:none}
.kv .k{font-size:13px;font-weight:600;color:var(--ink-3);background:var(--bg)}
.kv .v{color:var(--ink-2)}
.issue{border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.issue .q{padding:14px 18px;background:var(--bg)}
.issue .a{padding:12px 18px 14px}
.issue .tag{font-family:var(--mono);font-size:11.5px;font-weight:700;display:block;margin-bottom:3px}
.issue .q .tag{color:#DC2626}
.issue .a .tag{color:#16A34A}
.issue .q p{font-weight:650;font-size:15.5px}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 10px}
.result div{padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.result b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.result small{font-size:13px;color:var(--ink-3)}
.note{background:var(--bg);border-radius:12px;padding:14px 18px;margin:12px 0}
.note b{display:block;margin-bottom:3px}
.note p{color:var(--ink-2);font-size:15px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 44px 52px}
.pager button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer}
.pager button:hover{border-color:var(--ink)}
.pager .nx{text-align:right}
.pager small{display:block;font-size:12px;color:var(--ink-3)}
.pager span{font-weight:700;font-size:14px}

@media (max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .wrap{padding:0 18px}
  header{padding:44px 0 0;margin-bottom:28px}
  .hline{margin-top:28px}
  .sub br{display:none}
  .head{flex-direction:column;gap:16px}
  .contact{margin-top:0}
  .pop{left:0;right:auto;width:min(310px,calc(100vw - 36px))}
  .grid{grid-template-columns:1fr}
  .sbar{padding:0 14px}.sbar .path{display:none}
  .dhead{padding:28px 20px 22px}
  .tabs{padding:0 8px}.tabs a{padding:13px 9px 11px;font-size:13px}
  .dsec{padding:32px 20px 6px}
  .pager{padding:8px 20px 40px;grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}.kv div:nth-child(2){border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <span class="eyebrow"><i></i>Embedded Software</span>
      <h1><span class="name">이호윤</span><span class="rest">의 포트폴리오</span></h1>
      <p class="sub">지금까지 제가 진행한 프로젝트입니다.<br>아래 카드를 누르면 각 프로젝트의 상세 내용이 열립니다.</p>
    </div>
    <div class="contact">
      <button class="cbtn" id="cbtn" aria-expanded="false" aria-controls="pop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Contact
      </button>
      <div class="pop" id="pop" role="dialog" aria-label="연락처">
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <div class="tx"><small>Phone</small><a href="tel:010-7703-8802">010-7703-8802</a></div><button class="copy" data-copy="010-7703-8802">복사</button></div>
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <div class="tx"><small>Email</small><a href="mailto:hylee8808@naver.com">hylee8808@naver.com</a></div><button class="copy" data-copy="hylee8808@naver.com">복사</button></div>
        <div class="row"><span class="ic"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></span>
          <div class="tx"><small>GitHub</small><a href="https://github.com/nooyoh" target="_blank" rel="noopener">github.com/nooyoh</a></div><button class="copy" data-copy="https://github.com/nooyoh">복사</button></div>
      </div>
    </div>
  </div>
  <div class="wrap"><div class="hline"><span>PROJECTS <b>04</b></span></div></div>
</header>

<main>
  <div class="wrap"><div class="grid" id="cards"></div></div>
</main>
<footer><div class="wrap">© 이호윤 · Portfolio</div></footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true">
  <div class="sbar">
    <span class="path" id="path"></span>
    <div class="ctrl"><a class="btn" id="gh-top" target="_blank" rel="noopener"></a><button class="btn" id="close" aria-label="닫기">닫기 ✕</button></div>
  </div>
  <div class="sbody" id="sbody"></div>
</aside>

<script>
/* ============ COVER ILLUSTRATIONS — 결과물 중심, 수치 없음 ============ */
const INK="#1F2937", SOFT="#CBD5E1", BLUE="#2563EB";

const COVER = {
/* 01 로봇팔 — 착용형 센서 팔 ↔ 무선 ↔ 같은 자세의 로봇팔 */
arm: ()=>`<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="300" fill="#EEF3FB"/>
  <circle cx="240" cy="150" r="150" fill="#E3EBF8"/>
  <!-- person wearing sensors -->
  <circle cx="72" cy="88" r="17" fill="#F2C9A8"/>
  <path d="M44 236 V136 q0 -24 28 -24 q28 0 28 24 V236z" fill="#334155"/>
  <rect x="52" y="146" width="28" height="22" rx="3" fill="#fff" stroke="${INK}" stroke-width="2"/>
  <circle cx="60" cy="157" r="2.6" fill="${BLUE}"/><rect x="66" y="152" width="10" height="10" rx="1" fill="${SOFT}"/>
  <g stroke-linecap="round" fill="none">
    <path d="M94 128 L132 176" stroke="#475569" stroke-width="18"/>
    <path d="M132 176 L176 140" stroke="#F2C9A8" stroke-width="14"/>
  </g>
  <rect x="100" y="140" width="24" height="12" rx="4" transform="rotate(52 112 146)" fill="${BLUE}"/>
  <rect x="146" y="152" width="22" height="11" rx="4" transform="rotate(-39 157 157)" fill="${BLUE}"/>
  <circle cx="132" cy="176" r="8" fill="#fff" stroke="${BLUE}" stroke-width="3"/>
  <g transform="translate(184 134)">
    <ellipse rx="11" ry="10" fill="#F2C9A8"/>
    ${[-7,-2,3,8].map(d=>`<path d="M5 ${d} l10 ${-d*.3-2}" stroke="#F2C9A8" stroke-width="4.5" stroke-linecap="round"/><circle cx="15" cy="${d-d*.3-2}" r="2.3" fill="${BLUE}"/>`).join("")}
  </g>
  <!-- wireless -->
  <g fill="none" stroke="${BLUE}" stroke-width="3" stroke-linecap="round">
    <path d="M222 132 a18 18 0 0 1 0 28" opacity=".45"/><path d="M234 122 a32 32 0 0 1 0 48" opacity=".7"/><path d="M246 112 a46 46 0 0 1 0 68"/>
  </g>
  <!-- robot arm mirroring -->
  <rect x="300" y="226" width="96" height="16" rx="5" fill="${INK}"/>
  <path d="M322 226 q26 -26 52 0z" fill="#334155"/>
  <g stroke-linecap="round" fill="none">
    <path d="M348 208 L362 132" stroke="#3B82F6" stroke-width="20"/>
    <path d="M362 132 L420 110" stroke="#3B82F6" stroke-width="17"/>
  </g>
  <circle cx="348" cy="208" r="12" fill="#fff" stroke="${INK}" stroke-width="3"/>
  <circle cx="362" cy="132" r="11" fill="#fff" stroke="${INK}" stroke-width="3"/>
  <circle cx="420" cy="110" r="9" fill="#fff" stroke="${INK}" stroke-width="3"/>
  <g stroke="${INK}" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M428 104 l16 -8 l8 6"/><path d="M430 112 l18 -1 l6 7"/><path d="M428 118 l14 6 l2 8"/>
  </g>
</svg>`,

/* 02 열화상 — 저해상도 열화상 → 고해상도 복원 + 탐지 */
thermal: ()=>{
  const pal=["#1E1B4B","#3B1C6B","#7A1F6E","#C2385A","#EE6A2E","#F9A825","#FDE68A"];
  const g=(x,y,cx,cy,sx,sy)=>Math.exp(-(((x-cx)/sx)**2+((y-cy)/sy)**2));
  const heat=(x,y)=>Math.min(1,0.08+Math.max(g(x,y,0.38,0.62,0.12,0.3),g(x,y,0.38,0.22,0.08,0.1)*0.95,g(x,y,0.8,0.78,0.15,0.09)*0.7));
  let lr="";const NX=12,NY=9,cw=180/NX,ch=140/NY;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const v=heat((i+.5)/NX,(j+.5)/NY);lr+=`<rect x="${34+i*cw}" y="${80+j*ch}" width="${cw+.4}" height="${ch+.4}" fill="${pal[Math.min(6,Math.round(v*6))]}"/>`}
  return `<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="cp"><rect x="266" y="80" width="180" height="140" rx="10"/></clipPath>
    <clipPath id="cl"><rect x="34" y="80" width="180" height="140" rx="10"/></clipPath>
  </defs>
  <rect width="480" height="300" fill="#F4EEF6"/>
  <g clip-path="url(#cl)">${lr}</g>
  <rect x="34" y="80" width="180" height="140" rx="10" fill="none" stroke="${INK}" stroke-width="2"/>
  <g transform="translate(240 150)"><circle r="16" fill="#fff" stroke="${INK}" stroke-width="2"/><path d="M-6 0 h12 M2 -5 l5 5 l-5 5" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g clip-path="url(#cp)">
    <rect x="266" y="80" width="180" height="140" fill="#1E1B4B"/>
    <rect x="266" y="176" width="180" height="44" fill="#2A2160"/>

    if(vis[0]) setOn(vis[0].target.dataset.s);

function openP(id,push=true){

}
function closeP(push=true){
  sheet.classList.remove("on"); scrim.classList.remove("on"); sheet.setAttribute("aria-hidden","true");

scrim.onclick=()=>closeP();
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(sheet.classList.contains("on")) closeP(); else setPop(false); return; }
  if(!sheet.classList.contains("on")) return;
  const i=P.findIndex(p=>"#"+p.id===location.hash);
  if(i>-1 && e.key==="ArrowRight") openP(P[(i+1)%P.length].id);
  if(i>-1 && e.key==="ArrowLeft") openP(P[(i-1+P.length)%P.length].id);
});
function fromHash(){const id=location.hash.slice(1); if(P.some(p=>p.id===id)) openP(id,false); else if(sheet.classList.contains("on")) closeP(false);}
window.addEventListener("popstate",fromHash);
fromHash();
</script>
</body>
</html>
