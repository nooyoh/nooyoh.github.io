<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이호윤의 포트폴리오</title>
<meta name="description" content="이호윤이 진행한 임베디드 프로젝트 포트폴리오">
<meta property="og:title" content="이호윤의 포트폴리오">
<meta property="og:description" content="제가 진행한 프로젝트입니다. 카드를 누르면 프로젝트 상세 내용이 열립니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0B1310;      /* solder mask */
  --board-2:#101B17;
  --panel:#121E1A;
  --edge:#1F3129;
  --edge-2:#2B4338;
  --silk:#E7EEE9;       /* silkscreen */
  --silk-2:#A7B8AF;
  --silk-3:#6E8278;
  --copper:#D9A441;     /* pads / copper */
  --copper-dim:#7A5E2A;
  --led:#3BE38A;        /* status LED */
  --red:#FF5D5D;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--silk);background:var(--board);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;
  background-image:
    radial-gradient(circle at 1px 1px,rgba(217,164,65,.10) 1px,transparent 1.6px);
  background-size:24px 24px;
}
body.locked{overflow:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* ---------- header ---------- */
.top{border-bottom:1px solid var(--edge);background:linear-gradient(180deg,rgba(11,19,16,.0),rgba(11,19,16,.9))}
.status{font-family:var(--mono);font-size:12px;color:var(--silk-3);display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px dashed var(--edge)}
.status .ok{color:var(--led)}
.status .led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led);margin-right:8px;vertical-align:1px;animation:blink 2.4s infinite}
@keyframes blink{0%,92%{opacity:1}96%{opacity:.25}100%{opacity:1}}
.hero{padding:76px 0 64px;position:relative}
.boot{font-family:var(--mono);font-size:13px;color:var(--silk-3);margin-bottom:22px;line-height:1.9}
.boot b{color:var(--led);font-weight:500}
.boot i{font-style:normal;color:var(--copper)}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1.12}
.hero h1 .cur{display:inline-block;width:.5em;height:.9em;background:var(--copper);margin-left:.12em;vertical-align:-.08em;animation:cur 1.1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.hero p{margin-top:18px;font-size:18px;color:var(--silk-2);max-width:640px}
.hero p .k{font-family:var(--mono);font-size:.86em;color:var(--copper);border:1px solid var(--copper-dim);padding:1px 7px;border-radius:2px;margin:0 2px}

/* ---------- section ---------- */
.projects{padding:56px 0 88px}
.sh{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12.5px;color:var(--silk-3);margin-bottom:22px}
.sh strong{color:var(--silk);font-size:14px;font-weight:700;letter-spacing:.04em}
.sh strong::before{content:"// ";color:var(--copper)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.card{
  position:relative;font:inherit;color:inherit;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--edge-2);border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.card::before{ /* pin header row */
  content:"";position:absolute;left:18px;right:18px;top:-1px;height:6px;z-index:2;
  background:radial-gradient(circle,var(--copper) 2px,transparent 2.6px) 0 0/14px 6px repeat-x;opacity:.75;
}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--copper);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1px var(--copper-dim);outline:none}
.cover{aspect-ratio:16/9;background:#08100D;border-bottom:1px solid var(--edge-2);position:relative;overflow:hidden}
.cover svg{width:100%;height:100%;display:block}
.cover .ref{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:10.5px;color:var(--silk-3);letter-spacing:.08em}
.card .body{padding:20px 24px 22px;display:flex;flex-direction:column;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:12px}
.meta span{padding:3px 8px;border:1px solid var(--edge-2);border-radius:2px;color:var(--silk-2)}
.meta .no{background:var(--copper);border-color:var(--copper);color:#1A1406;font-weight:700}
.card h3{font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.38;margin:14px 0 8px}
.card .sum{color:var(--silk-2);font-size:15px}
.skills{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--edge-2)}
.skills li{font-family:var(--mono);font-size:11.5px;color:var(--led);background:rgba(59,227,138,.07);border:1px solid rgba(59,227,138,.28);padding:3px 8px;border-radius:2px}
.card .go{margin-top:auto;padding-top:18px;font-family:var(--mono);font-size:12.5px;color:var(--silk-3);display:flex;justify-content:space-between}
.card .go b{font-weight:700;color:var(--silk-2);transition:color .2s}
.card:hover .go b{color:var(--copper)}

footer{border-top:1px solid var(--edge);padding:26px 0 44px;font-family:var(--mono);font-size:12px;color:var(--silk-3)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{text-decoration:none;border-bottom:1px solid var(--edge-2)}
footer a:hover{color:var(--copper)}

/* ---------- detail sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,6,5,.7);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(900px,100%);z-index:50;background:var(--board-2);border-left:1px solid var(--copper-dim);
  transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sbar{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--edge);background:var(--board);font-family:var(--mono);font-size:12px;color:var(--silk-3)}
.sbar .path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .path b{color:var(--copper);font-weight:700}
.btn{font-family:var(--mono);font-size:12px;font-weight:700;border:1px solid var(--edge-2);background:transparent;color:var(--silk);padding:7px 12px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--copper);color:var(--copper)}
.btn.gh{background:var(--copper);border-color:var(--copper);color:#1A1406}
.btn.gh:hover{background:#F0BA55;color:#1A1406}
.btn svg{width:15px;height:15px;fill:currentColor}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.dhead{padding:38px 44px 28px}
.dhead .meta{margin-bottom:14px}
.dhead h2{font-size:clamp(25px,3.3vw,33px);font-weight:800;letter-spacing:-.03em;line-height:1.28}
.role{margin-top:22px;border:1px solid var(--edge-2);border-radius:4px;background:var(--panel)}
.role .lab{font-family:var(--mono);font-size:11.5px;color:var(--copper);padding:9px 16px;border-bottom:1px solid var(--edge);letter-spacing:.06em}
.role ul{list-style:none;padding:12px 16px 14px}
.role li{position:relative;padding-left:16px;color:var(--silk);font-size:15.5px;margin:3px 0}
.role li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;background:var(--led);border-radius:50%;box-shadow:0 0 6px var(--led)}
.dhead .actions{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:0;background:rgba(16,27,23,.96);backdrop-filter:blur(6px);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:0 44px;overflow-x:auto}
.tabs a{font-family:var(--mono);font-size:13px;color:var(--silk-3);text-decoration:none;padding:14px 16px 12px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a b{color:var(--copper-dim);margin-right:6px;font-weight:700}
.tabs a:hover{color:var(--silk)}
.tabs a.on{color:var(--silk);border-bottom-color:var(--copper)}
.tabs a.on b{color:var(--copper)}

.dsec{padding:40px 44px 8px;scroll-margin-top:52px}
.dsec:last-of-type{padding-bottom:40px}
.dsec>h3{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
.dsec>h3 .n{font-family:var(--mono);font-size:12px;color:#1A1406;background:var(--copper);padding:3px 8px;border-radius:2px}
.dsec>h3::after{content:"";flex:1;height:1px;background:var(--edge)}
.dsec h4{font-size:16.5px;font-weight:750;margin:26px 0 10px;color:var(--silk)}
.dsec h4:first-of-type{margin-top:6px}
.dsec h4 .m{font-family:var(--mono);font-size:12px;color:var(--copper);margin-right:8px}
ul.pts{list-style:none}
ul.pts li{position:relative;padding-left:20px;margin:7px 0;color:var(--silk-2);font-size:15.5px}
ul.pts li::before{content:"›";position:absolute;left:4px;top:-1px;color:var(--copper);font-weight:700}
ul.pts li strong{color:var(--silk);font-weight:650}
code{font-family:var(--mono);font-size:.86em;color:var(--led);background:rgba(59,227,138,.08);padding:1px 5px;border-radius:2px}
.kv{display:grid;grid-template-columns:120px 1fr;border:1px solid var(--edge-2);border-radius:4px;overflow:hidden;margin-top:20px}
.kv div{padding:10px 14px;border-top:1px solid var(--edge);font-size:14.5px}
.kv div:nth-child(-n+2){border-top:none}
.kv .k{font-family:var(--mono);font-size:12px;color:var(--silk-3);background:var(--panel);border-right:1px solid var(--edge)}
.kv .v{color:var(--silk-2)}
.issue{border:1px solid var(--edge-2);border-radius:4px;margin:16px 0;overflow:hidden;background:var(--panel)}
.issue .q,.issue .a{padding:14px 18px}
.issue .q{border-bottom:1px dashed var(--edge-2)}
.issue .tag{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;display:inline-block;margin-bottom:6px}
.issue .q .tag{color:var(--red)}
.issue .a .tag{color:var(--led)}
.issue .q p{color:var(--silk);font-weight:600;font-size:15.5px}
.issue ul.pts li{font-size:15px}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--edge-2);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.result div{padding:14px 16px;border-right:1px solid var(--edge);background:var(--panel)}
.result div:last-child{border-right:none}
.result b{display:block;font-family:var(--mono);font-size:21px;color:var(--led);letter-spacing:-.02em}
.result small{font-size:13px;color:var(--silk-3)}
.note{border-left:3px solid var(--copper);background:var(--panel);padding:14px 18px;margin:14px 0;border-radius:0 4px 4px 0}
.note b{display:block;margin-bottom:4px;color:var(--silk)}
.note p{color:var(--silk-2);font-size:15px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 44px 56px}
.pager button{font:inherit;color:var(--silk);text-align:left;background:var(--panel);border:1px solid var(--edge-2);border-radius:4px;padding:13px 16px;cursor:pointer}
.pager button:hover{border-color:var(--copper)}
.pager .nx{text-align:right}
.pager small{display:block;font-family:var(--mono);font-size:11px;color:var(--silk-3)}
.pager span{font-weight:700;font-size:14px}

@media (max-width:900px){.grid{grid-template-columns:1fr}}
@media (max-width:600px){
  .wrap{padding:0 18px}
  .hero{padding:52px 0 44px}
  .status span:last-child{display:none}
  .dhead{padding:28px 20px 22px}
  .tabs{padding:0 8px}
  .tabs a{padding:13px 10px 11px;font-size:12px}
  .dsec{padding:32px 20px 6px}
  .pager{padding:8px 20px 44px;grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv .k{border-right:none}
  .kv div:nth-child(2){border-top:1px solid var(--edge)}
  .sbar .path{display:none}
  .sbar .ctrl{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="status"><span><i class="led"></i>SYS.READY</span><span>BOARD: PORTFOLIO-REV.B &nbsp;|&nbsp; <span class="ok">4 MODULES LOADED</span></span></div>
    <div class="hero">
      <div class="boot">
        <div><b>[ OK ]</b> Initializing portfolio ...</div>
        <div><b>[ OK ]</b> Mounting <i>/projects</i> (4 entries)</div>
      </div>
      <h1>이호윤의 포트폴리오<span class="cur"></span></h1>
      <p>지금까지 제가 진행한 프로젝트입니다. 아래 <span class="k">카드</span>를 누르면 각 프로젝트의 개요, 설계 및 구현, 트러블슈팅, 리뷰를 담은 상세 내용이 열립니다.</p>
    </div>
  </div>
</header>

<main class="projects" id="projects">
  <div class="wrap">
    <div class="sh"><strong>PROJECTS</strong><span>ls ./projects | wc -l → 4</span></div>
    <div class="grid" id="cards"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>LEE HO YUN · PORTFOLIO</span>
    <a href="https://github.com/nooyoh" target="_blank" rel="noopener">github.com/nooyoh</a>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true">
  <div class="sbar">
    <span class="path" id="path"></span>
    <div class="ctrl" style="display:flex;gap:8px">
      <a class="btn gh" id="gh-top" target="_blank" rel="noopener"></a>
      <button class="btn" id="close" aria-label="닫기">ESC ✕</button>
    </div>
  </div>
  <div class="sbody" id="sbody"></div>
</aside>

<script>
/* ================= COVER ILLUSTRATIONS (SVG) ================= */
const F = `font-family="JetBrains Mono,Consolas,monospace"`;
const C = {silk:"#E7EEE9",silk2:"#A7B8AF",dim:"#4E6359",cu:"#D9A441",led:"#3BE38A",red:"#FF5D5D",bg:"#08100D",line:"#22362D"};
const grid = `<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="${C.line}" stroke-width=".6"/></pattern></defs><rect width="640" height="360" fill="${C.bg}"/><rect width="640" height="360" fill="url(#g)" opacity=".55"/>`;
const box = (x,y,w,h,t,s,col=C.silk)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#0E1915" stroke="${col}" stroke-width="1.4"/><text x="${x+w/2}" y="${y+h/2-(s?3:-4)}" ${F} font-size="12" font-weight="700" fill="${col}" text-anchor="middle">${t}</text>${s?`<text x="${x+w/2}" y="${y+h/2+13}" ${F} font-size="9.5" fill="${C.silk2}" text-anchor="middle">${s}</text>`:""}`;
const arrow = (x1,y,x2,lab)=>`<line x1="${x1}" y1="${y}" x2="${x2-6}" y2="${y}" stroke="${C.cu}" stroke-width="1.6"/><path d="M${x2} ${y} l-7 -4 v8z" fill="${C.cu}"/>${lab?`<text x="${(x1+x2)/2}" y="${y-8}" ${F} font-size="9" fill="${C.cu}" text-anchor="middle">${lab}</text>`:""}`;

const COVER = {
/* 01 Robot arm : pipeline + packet + arm + scope */
arm: ()=>{
  const bytes=["AA","55","A1","A1","A2","A2","A3","A3","F1","F2","F3","F4","RT","RT","CS"];
  const pk=bytes.map((b,i)=>{const col=i<2?C.cu:i<8?C.silk:i<12?C.led:i<14?"#F0BA55":C.red;
    return `<rect x="${32+i*27}" y="212" width="25" height="24" fill="#0E1915" stroke="${col}" stroke-width="1"/><text x="${44.5+i*27}" y="228" ${F} font-size="9.5" fill="${col}" text-anchor="middle">${b}</text>`}).join("");
  let scope="M32 312";for(let i=0;i<34;i++){const x=32+i*12;scope+=` L${x} 312 L${x+2} ${i%5==2?286:300} L${x+6} 312`}
  return `<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">${grid}
  ${box(28,58,92,52,"SENSOR","STM32 · TIM IC")}${arrow(120,84,152,"UART")}
  ${box(152,58,80,52,"ESP32","BT SPP")}${arrow(232,84,262,"BT")}
  ${box(262,58,72,52,"PC","IPC")}${arrow(334,84,366,"USB")}
  ${box(366,58,92,52,"ROBOT","STM32 · PWM")}
  <path d="M412 110 V150 H74 V116" fill="none" stroke="${C.led}" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M74 110 l-4 8 h8z" fill="${C.led}"/>
  <text x="243" y="168" ${F} font-size="10" fill="${C.led}" text-anchor="middle">ACK 0x06 → RTT 측정 · E2E ≈ RTT/2</text>
  <text x="32" y="202" ${F} font-size="9.5" fill="${C.silk2}">15-BYTE PACKET</text>${pk}
  <text x="32" y="270" ${F} font-size="9.5" fill="${C.silk2}">LATENCY PROBE</text>
  <path d="${scope}" fill="none" stroke="${C.led}" stroke-width="1.3"/>
  <g stroke="${C.silk}" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M500 316 h96"/><path d="M548 316 v-30"/><path d="M548 286 L520 214"/><path d="M520 214 L590 170"/>
    <path d="M590 170 l18 -12 M590 170 l20 4" stroke="${C.cu}"/>
  </g>
  <rect x="528" y="296" width="40" height="20" rx="3" fill="#0E1915" stroke="${C.silk}" stroke-width="1.6"/>
  ${[[548,286],[520,214],[590,170]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="${C.bg}" stroke="${C.cu}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2" fill="${C.cu}"/>`).join("")}
  <text x="500" y="340" ${F} font-size="9.5" fill="${C.silk2}">SERVO ×7 · 50Hz PWM</text>
  </svg>`},

/* 02 Thermal SR : LR grid -> model -> HR heatmap + bbox */
thermal: ()=>{
  const pal=["#1B0A3A","#3C0C63","#7A1C6E","#C2385A","#EE6A2E","#F9A825","#FDE68A"];
  const v=[[0,0,1,1,1,0,0,0],[0,1,2,3,2,1,0,0],[0,1,3,5,4,1,0,1],[0,1,4,6,4,1,1,2],[0,1,3,5,3,1,1,1],[0,0,2,3,2,0,0,0]];
  let lr="";v.forEach((r,j)=>r.forEach((c,i)=>{lr+=`<rect x="${34+i*17}" y="${70+j*17}" width="17" height="17" fill="${pal[c]}"/>`}));
  return `<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">${grid}
  <defs>
    <radialGradient id="hp" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#FDE68A"/><stop offset=".25" stop-color="#F9A825"/><stop offset=".5" stop-color="#EE6A2E"/><stop offset=".72" stop-color="#7A1C6E"/><stop offset="1" stop-color="#1B0A3A" stop-opacity="0"/></radialGradient>
    <linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B0A3A"/><stop offset="1" stop-color="#2A0D4D"/></linearGradient>
  </defs>
  <text x="34" y="60" ${F} font-size="10" fill="${C.silk2}">THERMAL LR 80×60</text>
  <rect x="33" y="69" width="138" height="104" fill="none" stroke="${C.silk}" stroke-width="1.2"/>${lr}
  <text x="34" y="208" ${F} font-size="10" fill="${C.silk2}">VIS HR 640×480</text>
  <rect x="33" y="216" width="138" height="104" fill="#0E1915" stroke="${C.silk}" stroke-width="1.2"/>

      <div class="actions"><a class="btn gh" href="${p.gh}" target="_blank" rel="noopener">${GH_ICON}GitHub 저장소 바로가기 ↗</a></div>
    </div>
    <nav class="tabs" aria-label="목차">${SECS.map(([k,t],n)=>`<a href="#${p.id}-${k}" data-t="${k}"><b>0${n+1}</b>${t}</a>`).join("")}</nav>
    ${SECS.map(([k,t],n)=>`<section class="dsec" id="${p.id}-${k}" data-s="${k}"><h3><span class="n">0${n+1}</span>${t}</h3>${p[k]}</section>`).join("")}
    <div class="pager">
      <button data-go="${prev.id}"><small>← PREV ${prev.no}</small><span>${prev.title}</span></button>
      <button class="nx" data-go="${next.id}"><small>NEXT ${next.no} →</small><span>${next.title}</span></button>
    </div>`;
  sbody.scrollTop=0;
  const tabs=[...sbody.querySelectorAll(".tabs a")];
  const setOn=k=>tabs.forEach(a=>a.classList.toggle("on",a.dataset.t===k));
  setOn("s1");
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>{
    const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(vis[0]) setOn(vis[0].target.dataset.s);
  },{root:sbody,rootMargin:"-60px 0px -55% 0px"});
  sbody.querySelectorAll(".dsec").forEach(s=>io.observe(s));
}
function openP(id,push=true){
  const p=P.find(x=>x.id===id); if(!p) return;
  if(!sheet.classList.contains("on")) lastFocus=document.activeElement;
  render(p);
  sheet.classList.add("on"); scrim.classList.add("on"); sheet.setAttribute("aria-hidden","false");
  document.body.classList.add("locked");
  if(push && location.hash!=="#"+id) history.pushState(null,"","#"+id);
  document.getElementById("close").focus({preventScroll:true});
}
function closeP(push=true){
  sheet.classList.remove("on"); scrim.classList.remove("on"); sheet.setAttribute("aria-hidden","true");
  document.body.classList.remove("locked");
  if(push && P.some(p=>"#"+p.id===location.hash)) history.pushState(null,"",location.pathname+location.search);
  if(lastFocus) lastFocus.focus({preventScroll:true});
}
cards.addEventListener("click",e=>{const c=e.target.closest(".card"); if(c) openP(c.dataset.id);});
sbody.addEventListener("click",e=>{
  const t=e.target.closest(".tabs a");
  if(t){e.preventDefault(); const s=sbody.querySelector(`[data-s="${t.dataset.t}"]`);
    sbody.scrollTo({top:s.getBoundingClientRect().top-sbody.getBoundingClientRect().top+sbody.scrollTop-sbody.querySelector(".tabs").offsetHeight+1,behavior:"smooth"}); return;}
  const b=e.target.closest("[data-go]"); if(b) openP(b.dataset.go);
});
document.getElementById("close").onclick=()=>closeP();
scrim.onclick=()=>closeP();
document.addEventListener("keydown",e=>{
  if(!sheet.classList.contains("on")) return;
  if(e.key==="Escape") closeP();
  const i=P.findIndex(p=>"#"+p.id===location.hash);
  if(i>-1 && e.key==="ArrowRight") openP(P[(i+1)%P.length].id);
  if(i>-1 && e.key==="ArrowLeft") openP(P[(i-1+P.length)%P.length].id);
});
function fromHash(){const id=location.hash.slice(1); if(P.some(p=>p.id===id)) openP(id,false); else if(sheet.classList.contains("on")) closeP(false);}
window.addEventListener("popstate",fromHash);
fromHash();
</script>
</body>
